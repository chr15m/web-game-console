<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Game Console</title>
    <style>
      @font-face {
        font-family: 'Luckiest Guy';
        src: url('LuckiestGuy-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: 'Comic Mono';
        src: url('ComicMono.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: 'Comic Mono';
        src: url('ComicMono-Bold.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 100vw;
        height: 100vh;
        background: #3D3846;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #screen {
        width: 100%;
        height: 100%;
        background: #3D3846;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      .doodles-background {
        position: absolute;
        top: 0;
        left: -100%;
        width: 200%;
        height: 200%;
        pointer-events: none;
        z-index: 1;
        color: #727782;
        opacity: 0.55;
        animation: doodle-drift 50s linear infinite;
        will-change: transform;
      }

      @keyframes doodle-drift {
        0% {
          transform: translate3d(0, 0, 0);
        }
        100% {
          transform: translate3d(50%, -50%, 0);
        }
      }

      .doodle-item {
        position: absolute;
        overflow: visible;
      }

      .title-container {
        width: 100%;
        padding: 0 20px;
        margin-top: 55px;
        margin-bottom: 15px;
        position: relative;
        z-index: 2;
        animation: title-bob 3s ease-in-out infinite;
      }

      @keyframes title-bob {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .curved-title {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
        filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.2));
      }

      .title-text {
        font-family: 'Luckiest Guy', cursive, sans-serif;
        letter-spacing: 10px;
        stroke-width: 24px;
        stroke-linecap: round;
        stroke-linejoin: round;
        paint-order: stroke fill;
        dominant-baseline: middle;
      }

      .title-text textPath:first-of-type {
        font-size: 98px;
      }

      .title-text textPath:last-of-type {
        font-size: 116px;
      }

      .extrude {
        fill: #212123;
        stroke: #212123;
      }

      .front {
        fill: #F02828;
        stroke: #212123;
      }

      .menu-container {
        position: relative;
        z-index: 2;
        width: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        margin-top: 0;
        margin-bottom: 24px;
      }

      .menu-item {
        position: relative;
        font-family: 'Comic Mono', monospace;
        font-weight: bold;
        text-transform: lowercase;
        color: #212123;
        -webkit-text-stroke: 6px #212123;
        font-size: 28.5px;
        letter-spacing: 1.5px;
        cursor: pointer;
        user-select: none;
        margin: 10px 0;
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.15));
        transition: font-size 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                    padding 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                    filter 0.25s ease,
                    -webkit-text-stroke 0.2s ease;
        text-align: center;
        line-height: 1.1;
        padding: 6px 0;
      }

      .menu-item::after {
        content: attr(data-text);
        position: absolute;
        left: 0;
        top: 6px;
        width: 100%;
        color: #E5A50A;
        -webkit-text-stroke: 0;
        pointer-events: none;
      }

      .menu-item.selected {
        font-size: 57px;
        -webkit-text-stroke: 11px #212123;
        padding: 9px 0;
        filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.25));
        animation: menu-pulse 0.5s ease-in-out infinite;
      }

      .menu-item.selected::after {
        top: 9px;
      }

      @keyframes menu-pulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      #update-status {
        position: absolute;
        bottom: 8px;
        font-family: 'Comic Mono', monospace;
        font-size: 14px;
        color: #aaa;
        z-index: 3;
      }
    </style>
    <script src="gamepad.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>

      <div id="doodles-layer" class="doodles-background"></div>

        <svg class="curved-title" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <path id="curve-line1" d="M 20 105 Q 350 20 680 105"></path>
            <path id="curve-line2" d="M 20 235 Q 350 150 680 235"></path>
            <g id="title-lines">
              <text class="title-text">
                <textPath href="#curve-line1" text-anchor="middle" startOffset="50%">
                  WEB GAME
                </textPath>
              </text>
              <text class="title-text">
                <textPath href="#curve-line2" text-anchor="middle" startOffset="50%">
                  CONSOLE
                </textPath>
              </text>
            </g>
          </defs>
          <use href="#title-lines" transform="translate(0, 20) translate(350, 170) scale(0.94) translate(-350, -170)" class="extrude" />
          <use href="#title-lines" transform="translate(0, 15) translate(350, 170) scale(0.955) translate(-350, -170)" class="extrude" />
          <use href="#title-lines" transform="translate(0, 10) translate(350, 170) scale(0.97) translate(-350, -170)" class="extrude" />
          <use href="#title-lines" transform="translate(0, 5) translate(350, 170) scale(0.985) translate(-350, -170)" class="extrude" />
          <use href="#title-lines" class="front" />
        </svg>
      </div>
      <div id="main-menu" class="menu-container">
        <div class="menu-item selected" data-text="browse games" data-href="basic-platformer.html">browse games</div>
        <div class="menu-item" data-text="enter gamecode" data-href="app-gameloader.html">enter gamecode</div>
        <div class="menu-item" data-text="wifi settings" data-href="app-wifi.html">wifi settings</div>
        <div class="menu-item" data-text="check for updates" data-action="update" id="update-btn">check for updates</div>
      </div>
      <div id="update-status"></div>
    </div>

    <script>
        let systemApi = null;
        let updateState = 'check'; // 'check' or 'install'
        let startupCheckDone = false;

        function setMenuItemText(item, text) {
            item.innerText = text;
            item.setAttribute('data-text', text);
        }

        function checkLocalUpdates(showUpToDate) {
            if (!systemApi) return;
            systemApi.check_update(function(responseStr) {
                try {
                    const response = JSON.parse(responseStr);
                    const btn = document.getElementById('update-btn');
                    const status = document.getElementById('update-status');
                    if (response.code === 0 && response.update_available) {
                        updateState = 'install';
                        setMenuItemText(btn, "install update");
                        status.innerText = "";
                    } else {
                        updateState = 'check';
                        setMenuItemText(btn, "check for updates");
                        if (showUpToDate) {
                            status.innerText = "up to date";
                        }
                    }
                } catch (e) {}
            });
        }

        function pollStartupUpdate() {
            if (startupCheckDone || !systemApi) return;
            systemApi.fetch_update(function(resStr) {
                try {
                    const res = JSON.parse(resStr);
                    if (res.code === 0) {
                        startupCheckDone = true;
                        checkLocalUpdates(true);
                    } else {
                        setTimeout(pollStartupUpdate, 10000);
                    }
                } catch (e) {
                    setTimeout(pollStartupUpdate, 10000);
                }
            });
        }

        if (typeof QWebChannel !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function (channel) {
                systemApi = channel.objects.systemApi;
                pollStartupUpdate();
            });
        }

        document.body.focus();

        const menuItems = Array.from(document.querySelectorAll('.menu-item'));
        let selectedMenuIdx = 0;

        function updateSelection(newIdx) {
            if (newIdx < 0) newIdx = menuItems.length - 1;
            if (newIdx >= menuItems.length) newIdx = 0;
            selectedMenuIdx = newIdx;

            menuItems.forEach((item, idx) => {
                if (idx === selectedMenuIdx) {
                    item.classList.remove('selected');
                    void item.offsetWidth;
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        function executeAction() {
            const item = menuItems[selectedMenuIdx];
            if (!item) return;

            const action = item.getAttribute('data-action');
            const href = item.getAttribute('data-href');

            if (action === 'update') {
                if (systemApi) {
                    const status = document.getElementById('update-status');
                    if (updateState === 'check') {
                        setMenuItemText(item, "checking...");
                        status.innerText = "";
                        systemApi.fetch_update(function(resStr) {
                            try {
                                const res = JSON.parse(resStr);
                                if (res.code === 0) {
                                    checkLocalUpdates(true);
                                } else {
                                    setMenuItemText(item, "check for updates");
                                    status.innerText = "network error";
                                }
                            } catch (e) {
                                setMenuItemText(item, "check for updates");
                                status.innerText = "error checking";
                            }
                        });
                    } else if (updateState === 'install') {
                        setMenuItemText(item, "installing & restarting...");
                        status.innerText = "";
                        systemApi.update_system(function(responseStr) {
                            try {
                                const response = JSON.parse(responseStr);
                                if (response.code !== 0) {
                                    setMenuItemText(item, "install update");
                                    status.innerText = "update failed";
                                }
                            } catch (e) {
                                setMenuItemText(item, "install update");
                                status.innerText = "update failed";
                            }
                        });
                    }
                }
            } else if (href) {
                window.location.href = href;
            }
        }

        menuItems.forEach((item, idx) => {
            item.addEventListener('click', () => {
                updateSelection(idx);
                executeAction();
            });
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                updateSelection(selectedMenuIdx - 1);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                updateSelection(selectedMenuIdx + 1);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                executeAction();
            }
        });

        const gamepad = new GamepadInput({
            onUp: () => {
                updateSelection(selectedMenuIdx - 1);
            },
            onDown: () => {
                updateSelection(selectedMenuIdx + 1);
            },
            onAction: () => {
                executeAction();
            }
        });
        gamepad.start();

        function initDoodleBackground() {
            const layer = document.getElementById('doodles-layer');
            if (!layer) return;

            const icons = [
                'icon-tamagotchi',
                'icon-gameboy',
                'icon-pacman',
                'icon-ghost',
                'icon-joystick',
                'icon-mushroom',
                'icon-controller',
                'icon-questionmark',
                'icon-star'
            ];

            let seed = 42;
            function rnd() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }

            const quadrantWidth = 720;
            const quadrantHeight = 720;
            const iconSize = 56;
            const minDist = 112;

            function toroidalDistSq(x1, y1, x2, y2) {
                let dx = Math.abs(x1 - x2);
                let dy = Math.abs(y1 - y2);
                if (dx > quadrantWidth / 2) dx = quadrantWidth - dx;
                if (dy > quadrantHeight / 2) dy = quadrantHeight - dy;
                return dx * dx + dy * dy;
            }

            const items = [];
            let iconIdx = 0;
            const maxAttempts = 1500;
            const minDistSq = minDist * minDist;

            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const candX = rnd() * quadrantWidth;
                const candY = rnd() * quadrantHeight;

                let ok = true;
                for (let j = 0; j < items.length; j++) {
                    if (toroidalDistSq(candX, candY, items[j].cx, items[j].cy) < minDistSq) {
                        ok = false;
                        break;
                    }
                }

                if (ok) {
                    const icon = icons[iconIdx % icons.length];
                    iconIdx++;
                    const rot = Math.round((rnd() - 0.5) * 16);
                    const opacity = (0.55 + rnd() * 0.35).toFixed(2);
                    items.push({
                        icon: icon,
                        size: iconSize,
                        cx: candX,
                        cy: candY,
                        x: candX - iconSize / 2,
                        y: candY - iconSize / 2,
                        rot: rot,
                        opacity: opacity
                    });
                }
            }

            let html = '';
            const offsets = [
                { dx: 0, dy: 0 },
                { dx: quadrantWidth, dy: 0 },
                { dx: 0, dy: quadrantHeight },
                { dx: quadrantWidth, dy: quadrantHeight }
            ];

            offsets.forEach(off => {
                items.forEach(it => {
                    const posX = Math.round(it.x + off.dx);
                    const posY = Math.round(it.y + off.dy);
                    html += `
                      <svg class="doodle-item" style="left: ${posX}px; top: ${posY}px; width: ${it.size}px; height: ${it.size}px; transform: rotate(${it.rot}deg); opacity: ${it.opacity};">
                        <use href="#${it.icon}"></use>
                      </svg>
                    `;
                });
            });

            layer.innerHTML = html;
        }

        initDoodleBackground();
    </script>
