<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Console Viewer</title>
  <style>
    @font-face {
      font-family: 'Luckiest Guy';
      src: url('LuckiestGuy-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Comic Mono';
      src: url('ComicMono.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Comic Mono';
      src: url('ComicMono-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-container {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
    }
    canvas {
      grid-row: 2;
      display: block;
      max-width: min(720px, 85vw);
      max-height: min(720px, 75vh);
      object-fit: contain;
      cursor: grab;
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }
    .coming-soon {
      grid-row: 3;
      font-family: 'Comic Mono', monospace;
      font-size: 20px;
      color: #727782;
      letter-spacing: 2px;
      user-select: none;
      pointer-events: none;
    }
    #loading {
      position: absolute;
      color: #888;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      letter-spacing: 0.05em;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .wgc-logo {
      position: absolute;
      top: 24px;
      left: 32px;
      width: 105px;
      height: 52px;
      overflow: visible;
      pointer-events: none;
      z-index: 10;
      filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.6))
              drop-shadow(0 0 30px rgba(255, 255, 255, 0.35))
              drop-shadow(0 0 60px rgba(255, 255, 255, 0.2));
    }
    .title-text {
      font-family: 'Luckiest Guy', cursive, sans-serif;
      font-size: 64px;
      letter-spacing: 4px;
      stroke-width: 16px;
      stroke-linecap: round;
      stroke-linejoin: round;
      paint-order: stroke fill;
      dominant-baseline: middle;
      text-anchor: start;
    }
    .extrude {
      fill: #212123;
      stroke: #212123;
    }
    .front {
      fill: #F02828;
      stroke: #212123;
    }
    .publish-link {
      position: absolute;
      top: 32px;
      right: 36px;
      font-family: 'Comic Mono', monospace;
      font-weight: bold;
      font-size: 20px;
      color: #E5A50A;
      text-decoration: none;
      text-transform: lowercase;
      letter-spacing: 1px;
      z-index: 10;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .publish-link:hover {
      opacity: 0.85;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <svg class="wgc-logo" viewBox="0 0 220 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <style>
        @font-face {
          font-family: 'Luckiest Guy';
          src: url('LuckiestGuy-Regular.ttf') format('truetype');
        }
        .title-text {
          font-family: 'Luckiest Guy', cursive, sans-serif;
          font-size: 64px;
          letter-spacing: 4px;
          stroke-width: 16px;
          stroke-linecap: round;
          stroke-linejoin: round;
          paint-order: stroke fill;
          dominant-baseline: middle;
          text-anchor: start;
        }
        .extrude {
          fill: #212123;
          stroke: #212123;
        }
        .front {
          fill: #F02828;
          stroke: #212123;
        }
      </style>
      <g id="wgc-text">
        <text class="title-text" font-family="'Luckiest Guy', cursive, sans-serif" x="12" y="52">WGC</text>
      </g>
    </defs>
    <use href="#wgc-text" transform="translate(0, 10)" class="extrude" />
    <use href="#wgc-text" transform="translate(0, 7.5)" class="extrude" />
    <use href="#wgc-text" transform="translate(0, 5)" class="extrude" />
    <use href="#wgc-text" transform="translate(0, 2.5)" class="extrude" />
    <use href="#wgc-text" class="front" />
  </svg>
  <a href="publisher/" class="publish-link">publish</a>
  <div id="loading">Loading 0%</div>
  <div class="viewer-container">
    <canvas id="view" width="720" height="720"></canvas>
    <div class="coming-soon">coming soon.</div>
  </div>

  <script>
    const TOTAL_FRAMES = 134;
    const PIXELS_PER_FRAME = 8;
    const AUTO_FPS = 24;

    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d');
    const loadingEl = document.getElementById('loading');

    const frames = [];
    let loadedCount = 0;
    let currentFrame = 0;
    let isDragging = false;
    let dragStartX = 0;
    let frameAtDragStart = 0;
    let lastTime = 0;
    let accumulatedTime = 0;

    function render() {
      const frameIdx = Math.floor(currentFrame) % TOTAL_FRAMES;
      const img = frames[frameIdx];
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const sx = (img.naturalWidth - canvas.width) / 2;
        ctx.drawImage(img, sx, 0, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
      }
    }

    function animate(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      if (!isDragging && loadedCount === TOTAL_FRAMES) {
        accumulatedTime += delta;
        const frameStep = 1 / AUTO_FPS;
        while (accumulatedTime >= frameStep) {
          currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
          accumulatedTime -= frameStep;
        }
        render();
      }

      requestAnimationFrame(animate);
    }

    function onPointerDown(e) {
      isDragging = true;
      dragStartX = e.clientX ?? (e.touches && e.touches[0].clientX) ?? 0;
      frameAtDragStart = currentFrame;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const clientX = e.clientX ?? (e.touches && e.touches[0].clientX) ?? 0;
      const dx = clientX - dragStartX;
      const frameDelta = -dx / PIXELS_PER_FRAME;
      currentFrame = ((frameAtDragStart + frameDelta) % TOTAL_FRAMES + TOTAL_FRAMES) % TOTAL_FRAMES;
      render();
    }

    function onPointerUp() {
      isDragging = false;
      accumulatedTime = 0;
    }

    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });
    window.addEventListener('touchcancel', onPointerUp, { passive: true });

    for (let i = 1; i <= TOTAL_FRAMES; i++) {
      const img = new Image();
      const numStr = String(i).padStart(4, '0');
      img.src = `3d-console/frame_${numStr}.jpg`;
      img.onload = () => {
        loadedCount++;
        loadingEl.textContent = `Loading ${Math.round((loadedCount / TOTAL_FRAMES) * 100)}%`;
        if (loadedCount === 1) render();
        if (loadedCount === TOTAL_FRAMES) {
          loadingEl.style.opacity = '0';
          setTimeout(() => loadingEl.remove(), 300);
        }
      };
      frames.push(img);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
