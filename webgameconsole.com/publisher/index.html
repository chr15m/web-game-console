<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WGC Publisher</title>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/scittle@latest/dist/scittle.min.js" type="application/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/scittle@latest/dist/scittle.promesa.min.js" type="application/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/scittle@latest/dist/scittle.reagent.min.js" type="application/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.17.2/lib/nostr.bundle.min.js"></script>
    <style>
        @font-face {
          font-family: 'Luckiest Guy';
          src: url('../LuckiestGuy-Regular.ttf') format('truetype');
          font-weight: normal;
          font-style: normal;
        }
        @font-face {
          font-family: 'Comic Mono';
          src: url('../ComicMono.ttf') format('truetype');
          font-weight: normal;
          font-style: normal;
        }
        @font-face {
          font-family: 'Comic Mono';
          src: url('../ComicMono-Bold.ttf') format('truetype');
          font-weight: bold;
          font-style: normal;
        }

        :root {
          --fg: #f0ede6;
          --bg: #000000;
          --panel-bg: #141416;
          --shade: #727782;
          --accent: #E5A50A;
          --brand-red: #F02828;
          --border: #212123;
          --error-bg: #782828;
          --radius: 6px;
          --content-width: 800px;
        }

        html {
          font-size: 1.15rem;
          box-sizing: border-box;
          height: 100%;
        }

        *, ::after, ::before {
          box-sizing: inherit;
        }

        body {
          margin: 0;
          background: var(--bg);
          color: var(--fg);
          font-family: 'Comic Mono', monospace;
          padding: 1em;
          height: 100%;
        }

        footer {
          text-align: center;
          padding: 2em 0px;
        }

        #app {
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          gap: 1em;
          min-height: 100%;
        }

        a { color: var(--fg); }

        body header, body main, body footer {
          margin: 0px auto;
          padding-left: 10px;
          padding-right: 10px;
          width: 100%;
        }

        body main {
          max-width: 100%;
          width: var(--content-width);
          flex-grow: 1;
        }

        body > header {
          padding-top: 1rem;
          padding-bottom: 1.5rem;
        }

        .header-brand {
          display: inline-flex;
          text-decoration: none;
          cursor: pointer;
          transition: transform 0.15s ease;
        }

        .header-brand:hover {
          transform: scale(1.05);
        }

        .wgc-logo {
          width: 105px;
          height: 52px;
          overflow: visible;
          filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.6))
                  drop-shadow(0 0 30px rgba(255, 255, 255, 0.35))
                  drop-shadow(0 0 60px rgba(255, 255, 255, 0.2));
        }

        .title-text {
          font-family: 'Luckiest Guy', cursive, sans-serif;
          font-size: 64px;
          letter-spacing: 4px;
          stroke-width: 16px;
          stroke-linecap: round;
          stroke-linejoin: round;
          paint-order: stroke fill;
          dominant-baseline: middle;
          text-anchor: start;
        }

        .extrude {
          fill: #212123;
          stroke: #212123;
        }

        .front {
          fill: #F02828;
          stroke: #212123;
        }

        h2, h3 {
          font-family: 'Luckiest Guy', cursive, sans-serif;
          letter-spacing: 1px;
          color: var(--fg);
        }

        h2 { font-size: 1.6em; margin-bottom: 1rem; }
        h3 { font-size: 1.3em; }

        button {
          display: inline-block;
          vertical-align: middle;
          padding: .4rem .8rem;
          font-family: 'Comic Mono', monospace;
          font-weight: bold;
          font-size: 0.95rem;
          text-transform: lowercase;
          margin-bottom: .5rem;
          background: var(--accent);
          color: #111;
          border: 2px solid var(--border);
          border-radius: var(--radius);
          cursor: pointer;
          transition: transform 0.1s ease, opacity 0.1s ease;
        }

        button:hover {
          opacity: 0.92;
          transform: scale(1.02);
        }

        button[type="reset"] {
          background: transparent;
          color: var(--fg);
          border-color: var(--shade);
        }

        button:disabled {
          cursor: not-allowed; 
          background: var(--border);
          border: 2px solid var(--border);
          color: var(--shade);
          transform: none;
        }

        label {
          display: block;
          font-weight: bold;
          margin-bottom: .4rem;
        }

        input[type="file"] {
          box-sizing: inherit;
          padding: .5rem .5rem;
          width: 100%;
          font-family: 'Comic Mono', monospace;
          font-size: 0.95rem;
          color: var(--fg);
          background-color: var(--panel-bg);
          border: 2px solid var(--border);
          border-radius: var(--radius);
          margin-bottom: .8rem;
        }

        table {
          width: 100%;
          border-spacing: 0;
          background: var(--panel-bg);
          border: 2px solid var(--border);
          border-radius: var(--radius);
          overflow: hidden;
        }

        td, th { padding: .75rem 1rem; }
        th {
          border-bottom: 2px solid var(--border);
          color: var(--accent);
          font-weight: bold;
          text-align: left;
        }
        td { border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }

        .spread {
          width: 100%;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        action-buttons {
          display: flex;
          justify-content: end;
          gap: 1em;
          align-items: center;
        }

        action-buttons svg {
          display: block;
          width: 24px;
          height: 24px;
          color: var(--shade);
        }

        .icon-sm { width: 18px; height: 18px; display: block; }

        .error {
          background-color: var(--error-bg);
          padding: 0.5em 1em;
          border-radius: var(--radius);
          font-size: 0.9rem;
        }

        .clickable { cursor: pointer; }

        dialog {
          background: var(--panel-bg);
          color: var(--fg);
          border: 2px solid var(--accent);
          border-radius: var(--radius);
          padding: 1.5em;
          max-width: 440px;
          width: 90%;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          margin: 0;
          box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
        }

        .dialog-actions {
          display: flex;
          justify-content: flex-end;
          gap: 10px;
          margin-top: 1.5em;
        }

        .game-code-display {
          font-size: 1.8rem;
          letter-spacing: 4px;
          background: #000;
          border: 2px solid var(--border);
          padding: 1rem;
          text-align: center;
          border-radius: var(--radius);
          margin: 1rem 0;
        }

        [data-notification-text] {
          position: relative;
        }

        [data-notification-text].notify::before {
          content: attr(data-notification-text);
          position: absolute;
          bottom: 100%;
          left: 50%;
          transform: translateX(-50%);
          background-color: var(--accent);
          color: #000;
          font-weight: bold;
          padding: 0.2rem 0.5rem;
          font-size: 0.8rem;
          border-radius: var(--radius);
          white-space: nowrap;
          pointer-events: none;
          z-index: 100;
        }

        .history-table td { vertical-align: middle; }
        .plus-btn-container { text-align: right; margin-top: 1.5rem; }
        .plus-btn {
          font-size: 1.5rem;
          padding: 0.4rem 1.2rem;
          border-radius: var(--radius);
          line-height: 1;
        }
        .copyable { cursor: pointer; }
        .copyable:hover { opacity: 0.85; }
        
        .formatted-code { display: inline-block; }
        .code-highlight {
          background: rgba(229, 165, 10, 0.15);
          border: 1px solid var(--accent);
          padding: 0.1em 0.3em;
          border-radius: var(--radius);
          margin-right: 0.3em;
        }
        .code-rest {
          opacity: 0.65;
        }
    </style>
    <script type="application/x-scittle" src="main.cljs"></script>
</head>
<body>
    <div id="app">Loading...</div>
